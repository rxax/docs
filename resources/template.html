<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@100&family=Lato:ital,wght@0,100;0,300;0,400;0,700;1,400&family=Outfit:wght@100&display=swap"
          rel="stylesheet">

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="js/scripts.js"></script>
    <script src="js/prism.js"></script>
    <link href="css/prism.css" type="text/css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
            crossorigin="anonymous"></script>
    <link href="css/default.css" type="text/css" rel="stylesheet"/>

    <!-- Vue.js -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <!-- fuzzy sort -->
    <script src="https://cdn.jsdelivr.net/npm/fuzzysort@3.1.0/fuzzysort.min.js"></script>
</head>

<body>
<div class="shadowed" id="vue_app">
    <div class="container-fluid h-100 ml-1 mr-1">
        <header class="border-bottom row background-gradient">
            <h1 class="col-9 float-left"><a href="index.html">Resources</a></h1>
            <span class="col-3 d-flex align-items-center float-end">

                <form id="search" class="row" onsubmit="javascript:void(0);">
                    <div class="col-8">
                        <input id="search_text" v-model="search_text" class="form-control float-end" type="text"/>
                    </div>
                    <div class="col-4">
                        <button class="button-15 float-end" role="button" @click="trigger_search">Search</button>
                    </div>
                </form>
            </span>
        </header>
        <div class="row justify-content-left h-100">

            <sidebar class="col-2 hidden-md-down">
                {sidebar}
            </sidebar>

            <main class="col-10 col-sm-10 col-md-10 col-lg-10 col-xl-10 border-left">
                <div v-html="search_results" id="search_results">
                    
                </div>
                <div id="static_text">
                    {body}
                </div>
               
            </main>

        </div>
    </div>
</div>

<script src="js/vuesearch.js"></script>

</body>
</html>
